name: Android CI & APK Build
on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]
workflow_dispatch:
permissions:
contents: write
jobs:
build-and-test:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
with:
fetch-depth: 0
- name: Auto-Unpack Project ZIP (Phone Upload Support)
run: |
if [ -f "CollegeCompanion-Android-Project.zip" ] && [ ! -f "settings.gradle.kts" ]; then
unzip -o CollegeCompanion-Android-Project.zip
git config user.name "github-actions[bot]"
git config user.email "github-actions[bot]@users.noreply.github.com"
git add .
git commit -m "Auto-extract College Companion Android project files" || true
git push || true
fi
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
- name: Set up Android SDK
uses: android-actions/setup-android@v3
- name: Setup Gradle
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.9'
- name: Run Unit Tests
run: gradle testDebugUnitTest --stacktrace
- name: Assemble Debug APK
run: gradle assembleDebug --stacktrace
- name: Assemble Release APK
env:
KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
KEY_ALIAS: {{ secrets.KEY_ALIAS }}
KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
run: |
if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
echo "{{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
export KEYSTORE_PATH="$PWD/release.keystore"
fi
gradle assembleRelease --stacktrace
rm -f release.keystore
- name: Upload Unit Test Report
if: always()
uses: actions/upload-artifact@v4
with:
name: Unit-Test-Report
path: app/build/reports/tests/testDebugUnitTest/
- name: Upload Debug APK Artifact
uses: actions/upload-artifact@v4
with:
name: CollegeCompanion-Debug-APK
path: app/build/outputs/apk/debug/*.apk
- name: Upload Release APK Artifact
uses: actions/upload-artifact@v4
with:
name: CollegeCompanion-Release-APK
path: app/build/outputs/apk/release/*.apk
- name: Publish Direct APK Downloads to GitHub Releases
env:
GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
run: |
cp app/build/outputs/apk/debug/app-debug.apk ./CollegeCompanion-debug.apk
cp app/build/outputs/apk/release/app-release*.apk ./CollegeCompanion-release.apk
gh release delete v1.0.0 --yes || true
git tag -d v1.0.0 || true
git push --delete origin v1.0.0 || true
gh release create v1.0.0 ./CollegeCompanion-debug.apk ./CollegeCompanion-release.apk 
--title "College Companion v1.0.0 APK" 
--notes "Tap CollegeCompanion-release.apk below under Assets to download and install directly on your Android phone."
